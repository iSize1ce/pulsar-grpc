version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # default
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # bugs / correctness
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - embeddedstructfieldcheck
    - errchkjson
    - errorlint
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - makezero
    - mirror
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - wastedassign

    # security
    - gosec

    # performance
    - perfsprint
    - prealloc

    # style / conventions
    - asciicheck
    - canonicalheader
    - containedctx
    - decorder
    - dogsled
    - dupword
    - err113
    - errname
    - exhaustive
    - exptostd
    - forbidigo
    - funcorder
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - grouper
    - iface
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - misspell
    - modernize
    - mnd
    - nakedret
    - nestif
    - nlreturn
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - predeclared
    - revive
    - tagalign
    - tagliatelle
    - unconvert
    - unparam
    - usestdlibvars
    - varnamelen
    - whitespace
    - wrapcheck
    - wsl_v5

    # complexity
    - cyclop
    - gocognit
    - gocyclo
    - maintidx

    # duplication
    - dupl

    # line length
    - lll

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true

    staticcheck:
      checks: ["all"]

    gosec:
      severity: low
      confidence: low

    cyclop:
      max-complexity: 10
      package-average: 5.0

    gocyclo:
      min-complexity: 10

    gocognit:
      min-complexity: 10

    funlen:
      lines: 60
      statements: 40

    maintidx:
      under: 20

    lll:
      line-length: 120

    dupl:
      threshold: 100

    nestif:
      min-complexity: 4

    nakedret:
      max-func-lines: 0

    goconst:
      min-len: 3
      min-occurrences: 2

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - hugeParam

    revive:
      severity: warning
      enable-all-rules: true
      rules:
        - name: cognitive-complexity
          arguments: [10]
        - name: cyclomatic
          arguments: [10]
        - name: function-length
          disabled: true
        - name: line-length-limit
          arguments: [120]
        - name: argument-limit
          disabled: true
        - name: max-public-structs
          arguments: [5]
        - name: file-header
          disabled: true
        - name: banned-characters
          disabled: true
        - name: add-constant
          disabled: true  # covered by mnd
        - name: unnecessary-format
          disabled: true

    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign

    varnamelen:
      min-name-length: 3
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - err
        - ok
        - id
        - wg
        - db
        - tx
        - i
        - j
        - k
        - n
        - w
        - r

    wrapcheck:
      ignore-package-globs:
        - google.golang.org/grpc/*
        - google.golang.org/protobuf/*

    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true

    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib

    tagliatelle:
      case:
        rules:
          json: snake
          db: snake

    godot:
      scope: all
      capital: true

    nlreturn:
      block-size: 2

    interfacebloat:
      max: 5

    dogsled:
      max-blank-identifiers: 2

    grouper:
      import-require-single-import: true
      import-require-grouping: true

    decorder:
      dec-order:
        - const
        - var
        - type
        - func
      disable-dec-order-check: false
      disable-init-func-first-check: false

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(pulsar-grpc)
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - testserver
  exclude-rules:
    # test files — relaxed rules
    - path: _test\.go
      linters:
        - funlen
        - gocognit
        - gocyclo
        - cyclop
        - maintidx
        - dupl
        - wrapcheck
        - err113
        - exhaustruct
        - gochecknoglobals
        - varnamelen
        - gocritic
        - revive
